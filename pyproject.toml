[project]
name = "ai-from-scratch"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Ali Firooz" }
]
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "setuptools>=75.1.0,<76.0.0",
    "numpy>=2.1.1,<3.0.0",
    "matplotlib>=3.9.2,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "orjson>=3.10.7,<4.0.0",
    "jupyter>=1.1.1,<2.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "toml>=0.10.2,<0.11.0",
    "pyyaml>=6.0.2,<7.0.0",
    "scipy>=1.14.1,<2.0.0",
    "lxml>=5.3.0,<6.0.0",
    "torch>=2.4.1,<3.0.0",
    "torchvision>=0.19.1,<0.20.0",
    "torchaudio>=2.4.1,<3.0.0",
    "ipympl>=0.9.4,<0.10.0",
    "scikit-image>=0.24.0,<0.25.0",
    "networkx>=3.3,<4.0.0",
    "graphviz>=0.20.3,<0.21.0",
    "varname>=0.13.5,<0.14.0",
    "scikit-learn>=1.5.2,<2.0.0",
    "lightning>=2.4.0,<3.0.0",
]

[[tool.uv.index]]
# for installing pytorch on cpu only (Linux)
# read more on: https://docs.astral.sh/uv/concepts/projects/dependencies/#alternate-indexes
# use `uv` normally like `uv sync` or `uv lock`
name = "torchcpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "torchcpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "torchcpu", marker = "sys_platform == 'linux'" }
torchaudio = { index = "torchcpu", marker = "sys_platform == 'linux'" }
